spring.application.name=AluguelDeCarros
# Conexão com o PostgreSQL do Supabase
# DB_URL: jdbc:postgresql://<HOST_DO_SESSION_POOLER>:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway cria a estrutura; Hibernate apenas valida os mapeamentos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Limite inicial de conexões da aplicação
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslmode=require

# Gerenciar somente o schema da aplicação, nunca os schemas internos do Supabase
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# React/Vite local; em implantação, informe a origem exata e use HTTPS.
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
